<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cube · are.na</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="top-left">
      <span class="logo">
        <svg class="logo-cube" viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="12,2 22,7 12,12 2,7" />
          <polygon points="2,7 12,12 12,22 2,17" />
          <polygon points="22,7 12,12 12,22 22,17" />
        </svg>
        <span class="logo-name">are.na cube</span>
      </span>
    </div>

    <form id="entry">
      <input id="entry-input" type="text" placeholder="paste an are.na block or channel URL" autocomplete="off" spellcheck="false" />
      <button id="entry-go" type="submit">go</button>
      <button id="entry-random" type="button">random</button>
      <button id="entry-play" type="button">are.na rubik's cube</button>
    </form>

    <div id="game-panel" hidden>
      <div id="game-goal-label" class="dim">flip your way to</div>
      <div id="game-goal-channel"></div>
      <div id="game-status">
        <span id="game-steps">0 flips</span>
        <button id="game-exit" type="button">give up</button>
      </div>
    </div>

    <div id="meta-left">
      <div id="meta-title" class="dim">loading…</div>
      <div id="meta-author" class="dim"></div>
      <div id="meta-created" class="dim"></div>
    </div>

    <div id="meta-right">
      <div id="meta-axis-h"></div>
      <div id="meta-axis-v"></div>
    </div>

    <div id="controls-hint">
      <div class="hint-item">
        <svg class="hint-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="3" width="8" height="14" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <line x1="12" y1="6" x2="12" y2="9" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <polyline points="9.5,20 12,22.5 14.5,20" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hint-label">scroll</span>
      </div>
      <div class="hint-item">
        <svg class="hint-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 11V5a1.5 1.5 0 0 1 3 0v6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M13 11V4a1.5 1.5 0 0 1 3 0v7" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
          <path d="M16 11V6a1.5 1.5 0 0 1 3 0v10a6 6 0 0 1-6 6h-1.5a5 5 0 0 1-4.3-2.5L5 16a1.5 1.5 0 0 1 2.6-1.5L10 17V7a1.5 1.5 0 0 1 3 0v4" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hint-label">drag</span>
      </div>
      <div class="hint-item">
        <svg class="hint-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <rect x="1.5" y="13.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <rect x="8.5" y="13.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <rect x="15.5" y="13.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.25"/>
          <polyline points="10.5,7 12,5 13.5,7" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="3.5,16 5,18 6.5,16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="10.5,18 12,16 13.5,18" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 12 17)"/>
          <polyline points="17.5,16 19,18 20.5,16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="hint-label">arrows</span>
      </div>
    </div>

    <canvas id="stage"></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
